spring:
  application:
    name: payment-system
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: payments
    password: payments
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    properties:
      auto.offset.reset: earliest


    consumer:
      group-id: payment-processor
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.payment.paymentsystem.event
        spring.json.use.type.headers: true
    listener:
      ack-mode: record
      concurrency: 3

app:
  idempotency:
    cache-ttl: 24h
    key-prefix: "idem:payment:"

  kafka:
    topics:
      payment-requested: payment.requested

  gateway:
    success-rate: 0.85
    failure-rate: 0.10
    timeout-rate: 0.05
    min-latency-ms: 200
    max-latency-ms: 600
    timeout-duration-ms: 3000

  webhook:
    signing-secret: "dev-only-secret-rotate-in-production"
    timeout-ms: 5000
    max-attempts: 3
    initial-backoff-ms: 1000
    replay-tolerance-seconds: 300

  reconciliation:
    stuck-threshold-seconds: 300
    scan-interval-ms: 60000
    max-per-sweep: 100
    enabled: true

server:
  port: 8090

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    # Group endpoints by tag in the UI (matches @Tag annotations on controllers)
    display-request-duration: true
    try-it-out-enabled: true
  # Don't expose internal endpoints in the Swagger UI
  packages-to-scan: com.payment.paymentsystem.controller
  # Show actuator endpoints separately if needed (we'll skip for now)
  show-actuator: false

logging:
  level:
    com.payment.paymentsystem: INFO
    org.flywaydb: INFO


management:
  endpoints:
    web:
      exposure:
        # Production-style: only expose what you need.
        # Add more endpoints here as you need them (info, loggers, etc.).
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      # Show detailed component breakdown when accessing /actuator/health
      show-details: always
      # Show per-component info under specific groups
      show-components: always
      # Enable separate liveness and readiness probes
      probes:
        enabled: true
  # Capture build info into the /actuator/info endpoint
  info:
    env:
      enabled: true
    git:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true

# Lets /actuator/info show metadata about this build
info:
  app:
    name: payment-system
    description: Event-driven payment processing system
    version: 0.5-actuator